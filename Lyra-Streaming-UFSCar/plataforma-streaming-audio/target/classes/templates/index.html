<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="#{app.title}">Lyra UFSCar — Plataforma Integrada de Streaming e Compartilhamento de Áudio Gratuito</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    if (window.tailwind) window.tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    :root {
      --bg-app: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-input: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent: #059669;
      --accent-hover: #047857;
      --accent-soft: rgba(16, 185, 129, 0.12);
    }
    html.dark {
      --bg-app: #0b0f19;
      --bg-surface: #111827;
      --bg-subtle: #1e293b;
      --bg-input: #0f172a;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border-color: #1f2937;
      --accent: #10b981;
      --accent-hover: #34d399;
      --accent-soft: rgba(16, 185, 129, 0.15);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-primary);
      transition: background-color 0.2s ease, color 0.2s ease;
      overflow-x: hidden;
    }
    .surface-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .surface-subtle {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
    }
    .theme-input {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }
    .theme-text-primary { color: var(--text-primary); }
    .theme-text-secondary { color: var(--text-secondary); }
    .theme-text-muted { color: var(--text-muted); }
    .theme-border { border-color: var(--border-color); }

    .grad-emerald { background: linear-gradient(135deg, #059669 0%, #10b981 55%, #0d9488 100%); }
    .grad-indigo  { background: linear-gradient(135deg, #4338ca 0%, #6366f1 55%, #0284c7 100%); }
    .grad-amber   { background: linear-gradient(135deg, #b45309 0%, #f59e0b 55%, #ea580c 100%); }
    .grad-rose    { background: linear-gradient(135deg, #be123c 0%, #f43f5e 55%, #9333ea 100%); }
    .grad-cyan    { background: linear-gradient(135deg, #0e7490 0%, #06b6d4 55%, #2563eb 100%); }
    .grad-violet  { background: linear-gradient(135deg, #5b21b6 0%, #8b5cf6 55%, #db2777 100%); }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @keyframes pulseBar {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
    }
    .eq-bar-1 { animation: pulseBar 0.7s infinite ease-in-out; }
    .eq-bar-2 { animation: pulseBar 0.5s infinite ease-in-out 0.15s; }
    .eq-bar-3 { animation: pulseBar 0.85s infinite ease-in-out 0.3s; }
  </style>
  <link rel="stylesheet" href="/css/ondesonora.css">
</head>
<body class="min-h-screen flex flex-col">
  <main id="welcomePage" class="flex-1 grid place-items-center p-5">
    <section class="surface-card rounded-2xl shadow-xl w-full max-w-sm p-6 sm:p-8">
      <span class="brand-symbol" aria-hidden="true">♪</span><h1 class="text-2xl font-bold theme-text-primary mb-5">Lyra</h1>
      <div class="flex gap-2 surface-subtle rounded-xl p-1 mb-5">
        <button type="button" id="welcomeLogin" onclick="window.app.setWelcomeTab('login')" class="flex-1 rounded-lg py-2 text-sm font-semibold">Entrar</button>
        <button type="button" id="welcomeRegister" onclick="window.app.setWelcomeTab('register')" class="flex-1 rounded-lg py-2 text-sm font-semibold">Criar conta</button>
      </div>
      <div id="welcomeForm"></div>
    </section>
  </main>
  <div id="workspacePage" class="hidden flex-1 flex-col">

  <div class="music-shell">
    <aside class="music-sidebar" aria-label="Navegação">
      <button type="button" class="music-brand" onclick="window.app.navigate('explorar')">
        <span class="brand-symbol" aria-hidden="true">♪</span> Lyra
      </button>
      <nav class="music-nav" aria-label="Menu principal">
        <button type="button" data-nav="explorar" data-icon="⌂" onclick="window.app.navigate('explorar')"></button>
        <button type="button" data-nav="busca" data-icon="⌕" onclick="window.app.navigate('busca')"></button>
        <button type="button" data-nav="biblioteca" data-icon="♫" onclick="window.app.navigate('biblioteca')"></button>
        <button type="button" data-nav="artistas" data-icon="◎" onclick="window.app.navigate('artistas')"></button>
        <button type="button" data-nav="estudio" data-icon="＋" onclick="window.app.navigate('estudio')"></button>
        <button type="button" data-nav="telemetria" data-icon="↗" onclick="window.app.navigate('telemetria')"></button>
        <button type="button" data-nav="moderacao" data-icon="⚑" onclick="window.app.navigate('moderacao')"></button>
        <button type="button" data-nav="admin" data-icon="⚙" onclick="window.app.navigate('admin')"></button>
      </nav>
    </aside>
    <div class="music-content">
      <header class="music-topbar">
        <label class="music-search">
          <span aria-hidden="true">⌕</span>
          <input id="headerSearchInput" type="search" aria-label="Buscar no catálogo" placeholder="O que você quer ouvir?" oninput="window.app.handleQuickSearch(this.value)">
        </label>
        <div class="music-preferences">
          <button type="button" onclick="window.app.toggleTheme()" title="Alternar tema"><span id="themeIcon">☀</span> <span id="themeLabel">Claro</span></button>
          <button type="button" onclick="window.app.toggleLanguage()" title="Alternar idioma"><span id="langBadgeText">PT-BR</span></button>
          <button type="button" id="btnOpenAuthModal" onclick="window.app.openAuthModal()">
            <img id="accountPicture" alt="" class="hidden w-5 h-5 rounded-full object-cover" />
            <span id="currentUserBadgeText">Conta</span>
          </button>
        </div>
      </header>
      <main id="spaViewport" class="music-viewport"></main>
    </div>
  </div>

  <!-- DYNAMIC QUEUE DRAWER -->
  <aside id="queueDrawer" class="fixed right-4 bottom-24 z-40 w-80 sm:w-96 max-h-[68vh] surface-card rounded-2xl shadow-2xl flex flex-col hidden">
    <div class="p-3.5 border-b theme-border flex items-center justify-between">
      <div>
        <h3 id="lblQueueTitle" class="text-sm font-bold theme-text-primary">Fila de reprodução</h3>
        <p id="lblQueueSubtitle" class="text-[11px] theme-text-muted">Reprodução contínua • Salta faixas suspensas</p>
      </div>
      <button type="button" onclick="window.app.toggleQueueDrawer()" class="theme-text-muted hover:opacity-80 p-1">✕</button>
    </div>
    <div class="p-2.5 border-b theme-border flex items-center justify-between gap-2 surface-subtle">
      <button type="button" id="btnClearQueue" onclick="window.app.clearQueue()" class="text-[11px] px-2.5 py-1 rounded-lg surface-card theme-text-secondary">
        Limpar
      </button>
    </div>
    <div id="queueListContainer" class="p-3 overflow-y-auto space-y-2 flex-1"></div>
  </aside>

  <!-- PERSISTENT AUDIO PLAYER BAR -->
  <footer aria-label="Persistent Audio Player" class="music-player">
    <div class="music-player-inner">

      <!-- Track Info -->
      <div class="player-track flex items-center gap-3 min-w-0">
        <div id="playerCoverArt" class="w-12 h-12 rounded-xl grad-emerald flex items-center justify-center shrink-0 shadow-sm">
          <div id="playerEqualizer" class="flex items-end gap-0.5 h-4 hidden">
            <span class="w-1 h-4 bg-white rounded eq-bar-1"></span>
            <span class="w-1 h-4 bg-white rounded eq-bar-2"></span>
            <span class="w-1 h-4 bg-white rounded eq-bar-3"></span>
          </div>
          <svg id="playerStaticIcon" class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <p id="playerTrackTitle" class="text-sm font-bold theme-text-primary truncate">Nenhuma faixa selecionada</p>
            <span id="playerFormatBadge" class="player-format text-[10px] font-mono px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30 shrink-0">—</span>
          </div>
          <p id="playerTrackAuthor" class="text-xs theme-text-muted truncate">—</p>
          <div class="flex items-center gap-2 mt-0.5">
          </div>
        </div>
        <button
          type="button"
          id="playerFavButton"
          onclick="window.app.toggleFavoriteCurrentTrack()"
          class="p-2 rounded-xl surface-subtle hover:opacity-80 transition text-sm"
          title="Favoritar"
        >
          ♥
        </button>
      </div>

      <!-- Controls & Seek Bar -->
      <div class="player-controls flex flex-col items-center gap-1.5">
        <div class="flex items-center gap-2">
          <button type="button" id="btnShuffle" onclick="window.app.toggleShuffle()" class="px-2 py-1 rounded-lg text-xs font-medium surface-subtle theme-text-secondary">🔀 Shuffle</button>
          <button type="button" aria-label="Faixa anterior" onclick="window.app.prevTrack()" class="px-2 py-1 rounded-lg surface-subtle theme-text-primary text-xs">⏮</button>
          <button type="button" data-skip-control onclick="window.app.seekRelative(-10)" class="px-2 py-1 rounded-lg text-[11px] font-mono surface-subtle theme-text-secondary">-10s</button>
          <button type="button" id="btnPlayPause" aria-label="Reproduzir ou pausar" onclick="window.app.togglePlayPause()" class="w-9 h-9 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold flex items-center justify-center shadow">▶</button>
          <button type="button" data-skip-control onclick="window.app.seekRelative(10)" class="px-2 py-1 rounded-lg text-[11px] font-mono surface-subtle text-emerald-600 dark:text-emerald-400 font-semibold">+10s</button>
          <button type="button" aria-label="Próxima faixa" onclick="window.app.nextTrack()" class="px-2 py-1 rounded-lg surface-subtle theme-text-primary text-xs">⏭</button>
          <button type="button" id="btnRepeat" onclick="window.app.toggleRepeat()" class="px-2 py-1 rounded-lg text-xs font-medium surface-subtle theme-text-secondary">🔁 Off</button>
        </div>
        <div class="w-full flex items-center gap-2.5">
          <span id="playerCurrentTime" class="text-[11px] font-mono theme-text-muted w-10 text-right">00:00</span>
          <input id="playerSeekSlider" aria-label="Posição da reprodução" type="range" min="0" max="100" value="0" oninput="window.app.seekToSecond(this.value)" class="flex-1 accent-emerald-600 h-1.5 rounded-lg cursor-pointer" />
          <span id="playerTotalDuration" class="text-[11px] font-mono theme-text-muted w-10">00:00</span>
        </div>
      </div>

      <!-- Adaptive Stream Quality & Volume -->
      <div class="player-tools flex items-center justify-end gap-2 flex-wrap">
        <div class="flex items-center gap-1.5 surface-subtle rounded-xl px-2 py-1">
          <button type="button" onclick="window.app.toggleMute()" id="btnMute" aria-label="Ativar ou silenciar som" class="text-xs">🔊</button>
          <input id="volumeSlider" aria-label="Volume" type="range" min="0" max="100" value="80" oninput="window.app.setVolume(this.value)" class="w-14 accent-emerald-600 h-1.5 rounded-lg cursor-pointer" />
        </div>

        <button type="button" onclick="window.app.toggleQueueDrawer()" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold surface-subtle theme-text-primary flex items-center gap-1.5">
          <span id="lblQueueBtn">Fila</span>
          <span id="queueCountBadge" class="px-1.5 py-0.2 rounded-full text-[10px] bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 font-bold">0</span>
        </button>
      </div>
    </div>
  </footer>

  </div>
  <!-- MODAL: AUTHENTICATION & PROFILE -->
  <div id="authModal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="surface-card rounded-2xl max-w-lg w-full p-5 shadow-2xl">
      <div class="flex items-center justify-between border-b theme-border pb-3 mb-4">
        <div>
          <h2 id="authModalTitle" class="text-base font-bold theme-text-primary">Minha conta</h2>
        </div>
        <button type="button" onclick="window.app.closeAuthModal()" class="theme-text-muted hover:opacity-80 p-1">✕</button>
      </div>
      <div class="flex gap-1.5 mb-4 surface-subtle p-1 rounded-xl">
        <button type="button" onclick="window.app.setAuthTab('profile')" id="tabBtnProfile" class="flex-1 py-1.5 rounded-lg text-xs font-semibold">Perfil</button>
        <button type="button" onclick="window.app.setAuthTab('recover')" id="tabBtnRecover" class="flex-1 py-1.5 rounded-lg text-xs font-semibold">Senha</button>
        <button type="button" onclick="window.app.logoutSession()" class="flex-1 py-1.5 rounded-lg text-xs font-semibold text-rose-500">Sair</button>
      </div>
      <div id="authModalBody"></div>
    </div>
  </div>

  <!-- MODAL: REPORT ABUSE -->
  <div id="reportModal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="surface-card rounded-2xl max-w-md w-full p-5 shadow-2xl">
      <div class="flex items-center justify-between border-b theme-border pb-3 mb-4">
        <div>
          <h2 id="reportModalHeading" class="text-base font-bold theme-text-primary">Denunciar faixa</h2>
          <p id="reportModalTrackLabel" class="text-xs text-emerald-600 dark:text-emerald-400 mt-0.5"></p>
        </div>
        <button type="button" onclick="window.app.closeReportModal()" class="theme-text-muted p-1">✕</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium theme-text-secondary mb-1">Motivo</label>
          <select id="reportReasonSelect" class="w-full theme-input rounded-xl px-3 py-2 text-xs">
            <option value="Violação de Direitos Autorais / Plágio">Violação de Direitos Autorais / Plágio</option>
            <option value="Uso de Sample ou Fonograma Sem Licença">Uso de Sample ou Fonograma Sem Licença</option>
            <option value="Conteúdo Impróprio ou Violação dos Termos">Conteúdo Impróprio ou Violação dos Termos</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium theme-text-secondary mb-1">Fundamentação / Technical Details</label>
          <textarea id="reportDetailsInput" rows="3" placeholder="Descreva os apontamentos..." class="w-full theme-input rounded-xl px-3 py-2 text-xs"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="window.app.closeReportModal()" class="px-3 py-1.5 rounded-xl text-xs surface-subtle theme-text-secondary">Cancelar</button>
          <button type="button" onclick="window.app.submitReport()" class="px-4 py-1.5 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white">Enviar Denúncia</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: DUPLICATE TRACK IN PLAYLIST CONFIRMATION -->
  <div id="duplicateConfirmModal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="surface-card rounded-2xl max-w-md w-full p-5 shadow-2xl">
      <h3 class="text-base font-bold text-amber-600 dark:text-amber-400 mb-2">⚠️ Faixa já adicionada</h3>
      <p id="duplicateModalText" class="text-xs theme-text-secondary leading-relaxed mb-4"></p>
      <div class="flex justify-end gap-2">
        <button type="button" onclick="window.app.cancelDuplicatePlaylistInsert()" class="px-3 py-1.5 rounded-xl text-xs surface-subtle theme-text-secondary">Cancelar</button>
        <button type="button" onclick="window.app.confirmDuplicatePlaylistInsert()" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-amber-500 text-slate-950">Reinserir</button>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer" aria-live="polite" class="fixed top-16 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

      async function catalogRequest(url, options) {
        const response = await fetch(url, options);
        const body = await response.json().catch(() => null);
        if (!response.ok) {
          const fallback = response.status === 413
            ? tr('O áudio ultrapassa o limite de 150 MB.', 'The audio exceeds the 150 MB limit.')
            : tr('Não foi possível concluir a operação no catálogo.', 'The catalog operation failed.');
          const message = typeof body?.error === 'string' && body.message === undefined ? body.error : fallback;
          throw new Error(message.replace(/\s*\((?:RF|RNF|UC)\d+(?:\s*[/,–&-]\s*(?:RF|RNF|UC)\d+)*\)/g, ''));
        }
        return body;
      }

      async function syncAudioPlayback(track) {
        const request = ++playbackRequest;
        if (!track?.serverId) {
          originalAudio.pause();
          originalTrackId = null;
          originalAudio.removeAttribute('src');
          originalAudio.load();
          if (state.player.isPlaying) playSynthesizedNoteForCurrentSecond();
          return;
        }
        if (!state.player.isPlaying) {
          originalAudio.pause();
          return;
        }
        try {
          if (originalTrackId !== track.id) {
            originalAudio.pause();
            const signed = await catalogRequest(`/api/stream/${track.serverId}/signed-url?quality=original`);
            if (request !== playbackRequest) return;
            originalTrackId = track.id;
            originalAudio.src = signed.streamUrl;
          }
          originalAudio.volume = state.player.volume / 100;
          originalAudio.muted = state.player.muted;
          await originalAudio.play();
        } catch (error) {
          if (request !== playbackRequest) return;
          originalTrackId = null;
          state.player.isPlaying = false;
          showToast(tr('Não foi possível reproduzir o áudio original.', 'The original audio could not be played.'), 'error');
        }
        if (request === playbackRequest) {
          syncPlayerBarUI();
          renderCurrentView();
        }
      }

      function showToast(message, type) {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const colors = {

          warning: 'bg-amber-500 text-slate-950 border-amber-400',
          error: 'bg-rose-600 text-white border-rose-500',

        };
        const el = document.createElement('div');
        el.className = `pointer-events-auto border rounded-xl px-3.5 py-2.5 text-xs font-semibold shadow-lg transition ${colors[type] || colors.info}`;
        el.textContent = message;
        container.appendChild(el);
        setTimeout(() => {

        }, 4000);
      }

      function playSynthesizedNoteForCurrentSecond() {
        if (!state.player.isPlaying || state.player.muted || state.player.volume <= 0) return;
        try {
          if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return;
            audioCtx = new AudioContextClass();
          }
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const track = state.tracks.find(x => x.id === state.player.currentTrackId) || state.tracks[0];
          if (!track || track.serverId) return;
          const notes = track.synthNotes || [261.63, 329.63, 392.00, 523.25];
          const freq = notes[state.player.currentTime % notes.length];

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = track.category === 'PODCAST' ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

          const vol = (state.player.volume / 100) * 0.08;
          gain.gain.setValueAtTime(vol, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0008, audioCtx.currentTime + 0.75);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.78);
        } catch (e) {}
      }

      function recordValidatedAudition(track) {
        if (state.player.validatedCurrentSession) return;
        state.player.validatedCurrentSession = true;
        track.playsTotal += 1;
        track.playsLast24h += 1;
        if (state.currentUser) {
          state.history.unshift({
            id: Date.now(),
            userId: state.currentUser.id,
            trackId: track.id,
            trackTitle: track.title,
            trackAuthors: track.authors,
            listenedSeconds: state.player.listenedContinuousSeconds,
            validatedOver30s: true,
            playedAt: nowFormatted()
          });
        }

        syncPlayerBarUI();
      }

      function startPlaybackInterval() {
        if (playbackTimer) clearInterval(playbackTimer);
        playbackTimer = setInterval(() => {
          if (!state.player.isPlaying) return;
          const track = state.tracks.find(x => x.id === state.player.currentTrackId);
          if (!track || track.status !== 'ATIVO') {
            app.nextTrack(true);
            return;
          }
          if (track.serverId) {
            if (originalTrackId !== track.id || originalAudio.paused || originalAudio.seeking) return;
            const time = Math.floor(originalAudio.currentTime);
            if (time > state.player.currentTime) state.player.listenedContinuousSeconds += 1;
            state.player.currentTime = time;
          } else {
            state.player.currentTime += 1;
            state.player.listenedContinuousSeconds += 1;
            playSynthesizedNoteForCurrentSecond();
          }

          if (state.player.listenedContinuousSeconds >= 30 && !state.player.validatedCurrentSession) {
            recordValidatedAudition(track);
          }
          if (!track.serverId && state.player.currentTime >= track.durationSeconds) {
            if (state.player.repeatMode === 'ONE') {
              state.player.currentTime = 0;
            } else {
              app.nextTrack(true);
            }
          }
          syncPlayerBarUI();
        }, 1000);
      }

        container.innerHTML = state.player.queueTrackIds.map((id, idx) => {
          const item = state.tracks.find(x => x.id === id);

          const isCurrent = item.id === state.player.currentTrackId;

          return `

      function renderBuscaView() {
        const q = (state.searchFilters.q || '').trim().toLowerCase();
        const cat = state.searchFilters.category;
        const gen = state.searchFilters.genre.toLowerCase();
        const tg = (state.searchFilters.tag || '').trim().toLowerCase();

        const results = state.tracks.filter(item => {
          if (item.status !== 'ATIVO') return false;
          if (cat !== 'TODOS' && item.category !== cat) return false;
          if (gen !== 'todos' && !item.genre.toLowerCase().includes(gen)) return false;
          if (tg && !item.tags.toLowerCase().includes(tg)) return false;
          if (!q) return true;
          return (
            item.title.toLowerCase().includes(q) ||
            item.authors.toLowerCase().includes(q) ||
            (item.albumTitle && item.albumTitle.toLowerCase().includes(q)) ||
            item.genre.toLowerCase().includes(q) ||
            item.tags.toLowerCase().includes(q)
          );
        });

        return `

              <div class="surface-card rounded-2xl p-6 text-center space-y-3">

      // VIEW 6: TELEMETRIA
      function renderEstatísticasView() {
        const activeTracks = state.tracks.filter(item => item.status !== 'REMOVIDO');
        const mult = state.analyticsPeriod === '24h' ? 0.2 : (state.analyticsPeriod === '7d' ? 0.5 : 1.0);
        const totalPlays = activeTracks.reduce((acc, item) => acc + Math.round(item.playsTotal * mult), 0);
        const totalUnique = activeTracks.reduce((acc, item) => acc + Math.round(item.uniqueListeners * mult), 0);
        const avgRet = (activeTracks.reduce((acc, item) => acc + item.avgRetentionPercent, 0) / Math.max(1, activeTracks.length)).toFixed(1);

        return `
          <div class="surface-card rounded-2xl p-5 space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h1 class="text-lg font-bold theme-text-primary">${tr('Estatísticas e Indicadores do Criador', 'Creator Telemetry & Analytics')}</h1>
                <p class="text-xs theme-text-muted">${tr('Execuções validadas (>30s), ouvintes únicos e retenção temporal', 'Validated plays (>30s), unique listeners and temporal retention')}</p>
              </div>
              <div class="flex gap-1 surface-subtle p-1 rounded-xl">
                ${['24h', '7d', 'all'].map(p => `
                  <button type="button" onclick="window.app.setAnalyticsPeriod('${p}')" class="px-3 py-1 rounded-lg text-xs font-semibold ${state.analyticsPeriod === p ? 'bg-emerald-600 text-white' : 'theme-text-secondary'}">${p.toUpperCase()}</button>
                `).join('')}
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="surface-subtle rounded-xl p-4">
                <span class="text-xs theme-text-muted">${tr('Execuções Validadas (>30s)', 'Validated Plays (>30s)')}</span>
                <p class="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1">${totalPlays.toLocaleString()}</p>
              </div>
              <div class="surface-subtle rounded-xl p-4">
                <span class="text-xs theme-text-muted">${tr('Ouvintes Únicos', 'Unique Listeners')}</span>
                <p class="text-2xl font-extrabold text-indigo-600 dark:text-indigo-400 mt-1">${totalUnique.toLocaleString()}</p>
              </div>
              <div class="surface-subtle rounded-xl p-4">
                <span class="text-xs theme-text-muted">${tr('Retenção Temporal Média', 'Average Retention')}</span>
                <p class="text-2xl font-extrabold text-amber-600 dark:text-amber-400 mt-1">${avgRet}%</p>
              </div>
            </div>

            <div class="surface-subtle rounded-xl p-4">
              <div class="relative h-72 w-full">
                <canvas id="telemetryChartCanvas"></canvas>
              </div>
            </div>
          </div>
        `;
      }

      function initTelemetryChart() {
        const canvas = document.getElementById('telemetryChartCanvas');
        if (!canvas || typeof Chart === 'undefined') return;
        if (telemetryChartInstance) telemetryChartInstance.destroy();
        const activeTracks = state.tracks.filter(item => item.status !== 'REMOVIDO');
        const mult = state.analyticsPeriod === '24h' ? 0.2 : (state.analyticsPeriod === '7d' ? 0.5 : 1.0);
        const textColor = state.theme === 'dark' ? '#cbd5e1' : '#334155';

        telemetryChartInstance = new Chart(canvas.getContext('2d'), {
          type: 'bar',
          data: {
            labels: activeTracks.map(item => item.title.slice(0, 20)),
            datasets: [
              {
                label: tr('Execuções Validadas (>30s)', 'Validated Plays (>30s)'),
                data: activeTracks.map(item => Math.round(item.playsTotal * mult)),
                backgroundColor: 'rgba(16, 185, 129, 0.8)',
                borderRadius: 6
              },
              {
                label: tr('Ouvintes Únicos', 'Unique Listeners'),
                data: activeTracks.map(item => Math.round(item.uniqueListeners * mult)),
                backgroundColor: 'rgba(99, 102, 241, 0.8)',

      const app = {
        setWelcomeTab(tab) {
          if (accountRequestInProgress) return;
          welcomeTab = tab;
          renderWelcome();
        },
        async submitWelcome(form) {
          if (accountRequestInProgress) return;
          const data = new FormData(form);
          const credentials = { email: data.get('email').trim(), password: data.get('password') };
          const errorMessage = form.querySelector('[data-error]');
          const button = form.querySelector('button');
          errorMessage.hidden = true;
          button.disabled = true;
          accountRequestInProgress = true;
          try {
            if (welcomeTab === 'register') {
              await accountRequest('/api/auth/register', 'POST', {
                ...credentials, fullName: data.get('fullName').trim()
              });
            }
            useAccount(await accountRequest('/api/auth/login', 'POST', credentials));
            form.reset();
          } catch (error) {
            errorMessage.textContent = error.message;
            errorMessage.hidden = false;
          } finally {
            accountRequestInProgress = false;
            button.disabled = false;
          }
        },
        browseCategory(category) {
          state.searchFilters = { q: '', category, genre: 'todos', tag: '' };
          document.getElementById('headerSearchInput').value = '';
          app.navigate('busca');
        },
        navigate(viewName) {
          state.currentView = viewName;
          renderCurrentView();
        },
        toggleTheme() {
          state.theme = state.theme === 'dark' ? 'light' : 'dark';
          renderCurrentView();
          showToast(
            tr(`Tema alterado para modo ${state.theme === 'dark' ? 'Escuro' : 'Claro'}.`,
               `Switched to ${state.theme === 'dark' ? 'Dark' : 'Light'} mode.`),
            'info'
          );
        },
        toggleLanguage() {
          state.lang = state.lang === 'pt' ? 'en' : 'pt';
          renderCurrentView();
          syncPlayerBarUI();
          showToast(
            state.lang === 'en' ? 'Language switched to English (EN-US).' : 'Idioma alterado para Português (PT-BR).',
            'info'
          );
        },

        handleQuickSearch(val) {
          if (state.currentView !== 'busca') {
            state.searchFilters = { q: '', category: 'TODOS', genre: 'todos', tag: '' };
          }
          state.searchFilters.q = val;
          if (state.currentView !== 'busca') state.currentView = 'busca';
          renderCurrentView();
        },
        updateSearchFilter(field, val) {
          state.searchFilters[field] = val;
          if (field === 'q') document.getElementById('headerSearchInput').value = val;
          renderCurrentView();
        },
        resetSearchFilters() {
          state.searchFilters = { q: '', category: 'TODOS', genre: 'todos', tag: '' };
          const headerInput = document.getElementById('headerSearchInput');
          if (headerInput) headerInput.value = '';
          renderCurrentView();
        },
        playTrack(trackId) {
          const track = state.tracks.find(x => x.id === trackId);
          if (!track || track.status !== 'ATIVO') {
            showToast(tr('Obra suspensa ou indisponível.', 'Track suspended or unavailable.'), 'warning');
            return;
          }
          if (state.player.currentTrackId !== trackId) {
            state.player.currentTrackId = trackId;
            state.player.currentTime = 0;
            state.player.listenedContinuousSeconds = 0;
            state.player.validatedCurrentSession = false;
          } else {
            app.togglePlayPause();
            return;
          }
          state.player.isPlaying = true;
          syncAudioPlayback(track);
          syncPlayerBarUI();
          renderCurrentView();
        },
        togglePlayPause() {
          const track = state.tracks.find(track => track.id === state.player.currentTrackId);
          if (!track || track.status !== 'ATIVO') return;
          state.player.isPlaying = !state.player.isPlaying;
          syncAudioPlayback(track);
          syncPlayerBarUI();
          renderCurrentView();
        },
        seekRelative(deltaSec) {
          app.seekToSecond(state.player.currentTime + deltaSec);
        },
        seekToSecond(sec) {
          const track = state.tracks.find(x => x.id === state.player.currentTrackId) || state.tracks[0];
          if (!track) return;
          state.player.currentTime = Math.max(0, Math.min(track.durationSeconds, Number(sec) || 0));
          if (track.serverId && originalTrackId === track.id) originalAudio.currentTime = state.player.currentTime;
          syncPlayerBarUI();
        },
        prevTrack() {
          const q = state.player.queueTrackIds;
          if (q.length === 0) return;
          const idx = q.indexOf(state.player.currentTrackId);
          const prevIdx = idx > 0 ? idx - 1 : q.length - 1;
          state.player.currentTrackId = -1;
          app.playTrack(q[prevIdx]);
        },
        nextTrack(automatic = false) {
          const player = state.player;
          const queue = player.queueTrackIds;
          const index = queue.indexOf(player.currentTrackId);
          const available = ids => ids.filter(id => state.tracks.some(track => track.id === id && track.status === 'ATIVO'));
          let candidates = available(queue.slice(index + 1));
          if (candidates.length === 0 && (!automatic || player.repeatMode === 'ALL')) {
            candidates = available(queue.slice(0, index + 1));
          }
          if (!candidates.length) {
            player.isPlaying = false;
            originalAudio.pause();
            syncPlayerBarUI();
            renderCurrentView();
            return;
          }
          const firstId = candidates[0];
          const nextId = player.shuffle ? candidates[Math.floor(Math.random() * candidates.length)] : firstId;
          if (nextId !== firstId) {
            const firstPosition = queue.indexOf(firstId);
            const nextPosition = queue.indexOf(nextId);
            queue[firstPosition] = nextId;
            queue[nextPosition] = firstId;
          }
          player.currentTrackId = -1;
          app.playTrack(nextId);
        },
        toggleShuffle() {
          state.player.shuffle = !state.player.shuffle;
          syncPlayerBarUI();
        },
        toggleRepeat() {
          const order = ['OFF', 'ALL', 'ONE'];
          const nextIndex = (order.indexOf(state.player.repeatMode) + 1) % order.length;
          state.player.repeatMode = order[nextIndex];
          syncPlayerBarUI();
        },
        setVolume(val) {
          state.player.volume = Number(val);
          state.player.muted = state.player.volume === 0;
          originalAudio.volume = state.player.volume / 100;
          originalAudio.muted = state.player.muted;
          document.getElementById('btnMute').textContent = state.player.muted ? '🔇' : '🔊';
        },
        toggleMute() {
          state.player.muted = !state.player.muted;
          originalAudio.muted = state.player.muted;
          document.getElementById('btnMute').textContent = state.player.muted ? '🔇' : '🔊';
        },
        toggleQueueDrawer() {
          document.getElementById('queueDrawer').classList.toggle('hidden');
          renderQueueDrawerList();
        },
        addToQueue(trackId, playNext) {
          const queue = state.player.queueTrackIds.filter(id => id !== trackId);
          if (playNext) {
            queue.splice(queue.indexOf(state.player.currentTrackId) + 1, 0, trackId);
          } else {
            queue.push(trackId);
          }
          state.player.queueTrackIds = queue;
          syncPlayerBarUI();
          showToast(tr('Faixa adicionada à fila.', 'Track added to queue.'), 'success');
        },
        removeFromQueueIndex(idx) {
          state.player.queueTrackIds.splice(idx, 1);
          syncPlayerBarUI();
        },
        clearQueue() {
          state.player.queueTrackIds = [state.player.currentTrackId];
          syncPlayerBarUI();
        },
        async toggleFavoriteTrack(trackId) {
          const user = state.currentUser;
          if (!user?.authenticated || updatingFavorite) return;
          updatingFavorite = true;
          try {
            const favorites = await accountRequest(`/api/auth/favorites/${trackId}`, 'PUT', {
              favorite: !user.favoriteTrackIds.includes(trackId)
            });
            if (state.currentUser?.id === user.id) {
              state.currentUser.favoriteTrackIds = favorites;
              syncPlayerBarUI();
              renderCurrentView();
            }
          } catch (error) {
            showToast(error.message, 'error');
          } finally {
            updatingFavorite = false;
          }
        },
        toggleFavoriteCurrentTrack() {
          app.toggleFavoriteTrack(state.player.currentTrackId);
        },
        selectPlaylist(pid) {
          state.selectedPlaylistId = pid;
          renderCurrentView();
        },
        createPlaylist() {
          const name = (document.getElementById('newPlaylistName')?.value || '').trim();
          const desc = (document.getElementById('newPlaylistDesc')?.value || '').trim();
          if (!name) return;
          const newPl = { id: Date.now(), name, description: desc, publicVisible: true, ownerUserId: state.currentUser.id, ownerName: state.currentUser.fullName, trackIds: [] };
          state.playlists.push(newPl);
          state.selectedPlaylistId = newPl.id;
          renderCurrentView();
        },
        addTrackToPlaylist(playlistId, trackId) {
          const pl = state.playlists.find(p => p.id === playlistId);
          const track = state.tracks.find(x => x.id === trackId);
          if (!pl || !track) return;
          if (pl.trackIds.includes(trackId)) {
            state.pendingDuplicateInsert = { playlistId, trackId };
            document.getElementById('duplicateModalText').textContent =
              tr(`A faixa "${track.title}" já consta na playlist "${pl.name}". Deseja reinseri-la?`,
                 `Track "${track.title}" is already in playlist "${pl.name}". Insert duplicate anyway?`);
            document.getElementById('duplicateConfirmModal').classList.remove('hidden');
            return;
          }
          pl.trackIds.push(trackId);
          showToast(tr('Adicionada à playlist!', 'Added to playlist!'), 'success');
          renderCurrentView();
        },
        confirmDuplicatePlaylistInsert() {
          if (state.pendingDuplicateInsert) {
            const { playlistId, trackId } = state.pendingDuplicateInsert;
            const pl = state.playlists.find(p => p.id === playlistId);
            if (pl) pl.trackIds.push(trackId);
          }
          state.pendingDuplicateInsert = null;
          document.getElementById('duplicateConfirmModal').classList.add('hidden');
          renderCurrentView();
        },
        cancelDuplicatePlaylistInsert() {
          state.pendingDuplicateInsert = null;
          document.getElementById('duplicateConfirmModal').classList.add('hidden');
        },
        movePlaylistTrack(playlistId, idx, dir) {
          const pl = state.playlists.find(p => p.id === playlistId);
          if (!pl) return;
          const targetIdx = idx + dir;
          if (targetIdx < 0 || targetIdx >= pl.trackIds.length) return;
          const tmp = pl.trackIds[idx];
          pl.trackIds[idx] = pl.trackIds[targetIdx];
          pl.trackIds[targetIdx] = tmp;
          renderCurrentView();
        },
        removePlaylistTrack(playlistId, idx) {
          const pl = state.playlists.find(p => p.id === playlistId);
          if (pl) pl.trackIds.splice(idx, 1);
          renderCurrentView();
        },
        togglePlaylistVisibility(playlistId) {
          const pl = state.playlists.find(p => p.id === playlistId);
          if (pl) pl.publicVisible = !pl.publicVisible;
          renderCurrentView();
        },
        playPlaylist(playlistId) {
          const pl = state.playlists.find(p => p.id === playlistId);
          if (!pl || pl.trackIds.length === 0) return;
          state.player.queueTrackIds = [...pl.trackIds];
          state.player.currentTrackId = -1;
          app.playTrack(pl.trackIds[0]);
        },
        openArtistProfile(artistId) {
          state.selectedArtistId = artistId;
          state.currentView = 'artistas';
          renderCurrentView();
        },
        toggleFollowArtist(artistId) {
          if (!state.currentUser) return;
          const artist = state.artists.find(a => a.id === artistId);
          if (!artist) return;
          const idx = state.currentUser.followedArtistIds.indexOf(artistId);
          if (idx >= 0) {
            state.currentUser.followedArtistIds.splice(idx, 1);
            artist.followersCount -= 1;
          } else {
            state.currentUser.followedArtistIds.push(artistId);
            artist.followersCount += 1;
          }
          renderCurrentView();
        },
        playAlbum(albumId) {
          const tracks = state.tracks.filter(x => x.albumId === albumId && x.status === 'ATIVO');
          if (tracks.length === 0) return;
          state.player.queueTrackIds = tracks.map(x => x.id);
          state.player.currentTrackId = -1;
          app.playTrack(tracks[0].id);
        },
        createArtistProfile() {
          const name = (document.getElementById('newArtistName')?.value || '').trim();
          const genres = (document.getElementById('newArtistGenres')?.value || '').trim();
          const bio = (document.getElementById('newArtistBio')?.value || '').trim();
          if (!name || !genres) return;
          const newArtist = { id: Date.now(), artisticName: name, genres, biography: bio, photoGrad: 'grad-cyan', ownerUserId: 2, followersCount: 1 };
          state.artists.push(newArtist);
          state.selectedArtistId = newArtist.id;
          renderCurrentView();
        },
        createAlbumWithTracks(forceEmptyErrorTest) {
          const title = (document.getElementById('newAlbumTitle')?.value || '').trim() || 'Novo Álbum';
          const modality = document.getElementById('newAlbumModality')?.value || 'ALBUM';
          const checkedIds = forceEmptyErrorTest ? [] : Array.from(document.querySelectorAll('.new-album-track-checkbox:checked')).map(cb => Number(cb.value));
          if (checkedIds.length === 0) {
            showToast(tr('Proibido publicar álbum sem vincular ao menos uma faixa!', 'Cannot publish an album with zero tracks!'), 'error');
            return;
          }
          const artist = state.artists.find(a => a.id === state.selectedArtistId) || state.artists[0];
          const newAlb = { id: Date.now(), title, modality, artistId: artist.id, artistName: artist.artisticName, releaseYear: 2026, releaseDate: '2026-11-11', description: 'Novo lançamento', coverGrad: 'grad-violet', participatingArtists: artist.artisticName };
          state.albums.push(newAlb);
          renderCurrentView();
        },
        selectCoverFile(file) {
          if (isPublishing) return;
          clearCoverSelection();
          const draft = state.uploadDraft;
          if (file) {
            if (!/\.(jpe?g|png)$/i.test(file.name) || file.size > 8 * 1024 * 1024) {
              showToast(tr('Selecione uma imagem JPEG ou PNG de até 8 MB.', 'Choose a JPEG or PNG image up to 8 MB.'), 'error');
              renderCurrentView();
              return;
            }
            selectedCoverFile = file;
            selectedCoverUrl = URL.createObjectURL(file);
            const preview = new Image();
            preview.onload = () => {
              if (selectedCoverFile !== file) return;
              draft.coverWidth = preview.naturalWidth;
              draft.coverHeight = preview.naturalHeight;
              coverReady = true;
              renderCurrentView();
            };
            preview.onerror = () => {
              if (selectedCoverFile !== file) return;
              clearCoverSelection();
              showToast(tr('Não foi possível abrir a capa.', 'The cover image could not be opened.'), 'error');
              renderCurrentView();
            };
            preview.src = selectedCoverUrl;
          }
          renderCurrentView();
        },
        selectAudioFile(file) {
          selectedAudioFile = null;
          selectedAudioDuration = 0;
          if (!file) {
            renderCurrentView();
            return;
          }
          const format = file.name.split('.').pop().toUpperCase();
          if (!['WAV', 'FLAC', 'MP3'].includes(format) || file.size > 150 * 1024 * 1024) {
            showToast(tr('Selecione um WAV, FLAC ou MP3 de até 150 MB.', 'Select a WAV, FLAC or MP3 file up to 150 MB.'), 'error');
            renderCurrentView();
            return;
          }
          selectedAudioFile = file;
          const draft = state.uploadDraft;
          draft.title = file.name.replace(/\.[^.]+$/, '').slice(0, 255);
          draft.audioFormat = format;
          const url = URL.createObjectURL(file);
          const probe = new Audio();
          probe.preload = 'metadata';
          function releaseProbe() {
            probe.removeAttribute('src');
            probe.load();
            URL.revokeObjectURL(url);
          }
          probe.addEventListener('loadedmetadata', () => {
            const duration = probe.duration;
            releaseProbe();
            if (selectedAudioFile !== file) return;
            if (Number.isFinite(duration) && duration > 0) {
              selectedAudioDuration = Math.ceil(duration);
              draft.bitrateKbps = Math.max(1, Math.round(file.size * 8 / duration / 1000));
              renderCurrentView();
            }
          }, { once: true });
          probe.addEventListener('error', () => {
            releaseProbe();
            if (selectedAudioFile !== file) return;
            showToast(tr('O navegador não conseguiu ler esse arquivo de áudio.', 'The browser could not read this audio file.'), 'error');
          }, { once: true });
          probe.src = url;
          renderCurrentView();
        },
        updateUploadDraft(field, val) {
          state.uploadDraft[field] = val;
        },
        async confirmPublishTrack() {
          if (isPublishing) return;
          const d = state.uploadDraft;
          const message = !selectedAudioFile ? tr('Selecione o arquivo de áudio.', 'Select an audio file.')
            : !selectedAudioDuration ? tr('Aguarde a leitura do áudio ou selecione outro arquivo.', 'Wait for the file to load or choose another.')
            : !d.title.trim() || !d.authors.trim() ? tr('Preencha o título e o nome do artista.', 'Enter a title and artist name.')
            : d.audioFormat === 'MP3' && d.bitrateKbps < 320 ? tr('Selecione um MP3 de 320 kbps.', 'Select a 320 kbps MP3.')
            : selectedCoverFile && (!coverReady || d.coverWidth < 1400 || d.coverHeight < 1400)
              ? tr('A capa precisa ter pelo menos 1400 × 1400 px.', 'Cover images must be at least 1400 × 1400 px.')
              : '';
          if (message) {
            showToast(message, 'error');
            return;
          }
          const data = new FormData();
          data.append('audio', selectedAudioFile);
          if (selectedCoverFile) data.append('cover', selectedCoverFile);
          const metadata = {
            title: d.title.trim(), category: d.category, modality: d.modality,
            authors: d.authors, genre: d.genre, tags: d.tags, description: d.description,
            audioFormat: d.audioFormat, bitrateKbps: d.bitrateKbps,
            coverWidth: selectedCoverFile ? d.coverWidth : 1600, coverHeight: selectedCoverFile ? d.coverHeight : 1600,
            durationSeconds: selectedAudioDuration
          };
          data.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
          isPublishing = true;
          renderCurrentView();
          try {
            const track = uploadedTrack(await catalogRequest('/api/catalog/tracks', { method: 'POST', body: data }));
            if (!state.tracks.some(item => item.id === track.id)) state.tracks.unshift(track);
            selectedAudioFile = null;
            selectedAudioDuration = 0;
            clearCoverSelection();
            d.title = '';
            showToast(tr('Áudio publicado no acervo.', 'Audio published to the catalog.'), 'success');
          } catch (error) {
            showToast(error.message, 'error');
          } finally {
            isPublishing = false;
            renderCurrentView();
          }
        },
        async quickEditTrackTitle(trackId) {
          const item = state.tracks.find(x => x.id === trackId);
          if (!item) return;
          const title = window.prompt(tr('Novo título da faixa', 'New track title'), item.title)?.trim();
          if (!title || title === item.title) return;
          if (title.length > 255) {
            showToast(tr('Use até 255 caracteres no título.', 'Use up to 255 characters.'), 'error');
            return;
          }
          if (item.serverId) {
            try {
              await catalogRequest(`/api/catalog/tracks/${item.serverId}`, {
                method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title })
              });
            } catch (error) {
              showToast(error.message, 'error');
              return;
            }
          }
          item.title = title;
          renderCurrentView();
        },
        async removeTrackByAuthor(trackId) {
          const item = state.tracks.find(x => x.id === trackId);
          if (!item || !window.confirm(tr('Remover esta faixa do catálogo?', 'Remove this track from the catalog?'))) return;
          if (item.serverId) {
            try {
              await catalogRequest(`/api/catalog/tracks/${item.serverId}`, { method: 'DELETE' });
            } catch (error) {
              showToast(error.message, 'error');
              return;
            }
            if (state.player.currentTrackId === item.id && state.player.isPlaying) {
              state.player.isPlaying = false;
              syncAudioPlayback(item);
            }
          }
          item.status = 'REMOVIDO';
          state.reports.forEach(r => {
            if (r.trackId === trackId && r.status === 'PENDENTE') {
              r.status = 'ENCERRADA_PERDA_OBJETO';
              r.technicalOpinion = 'Encerrada por perda de objeto.';
            }
          });
          renderCurrentView();
        },
        setAnalyticsPeriod(period) {
          state.analyticsPeriod = period;
          renderCurrentView();
        },
        openReportModal(trackId) {
          const track = state.tracks.find(x => x.id === trackId) || state.tracks[0];
          state.reportTargetTrackId = track.id;
          document.getElementById('reportModalTrackLabel').textContent = `${track.title} (${track.authors})`;
          document.getElementById('reportModal').classList.remove('hidden');
        },
        closeReportModal() {
          document.getElementById('reportModal').classList.add('hidden');
        },
        submitReport() {
          const track = state.tracks.find(x => x.id === state.reportTargetTrackId);
          if (!track) return;
          state.reports.unshift({
            id: Date.now(),
            trackId: track.id,
            trackTitle: track.title,
            creatorName: track.authors,
            reporterUserId: 1,
            reporterName: state.currentUser ? state.currentUser.fullName : 'Ouvinte',
            reason: document.getElementById('reportReasonSelect').value,
            description: document.getElementById('reportDetailsInput').value || 'Verificação autoral.',
            status: 'PENDENTE',
            technicalOpinion: '',
            moderatorName: '',
            createdAt: nowFormatted()
          });
          app.closeReportModal();
          showToast(tr('Denúncia enviada à fila de moderação.', 'Report submitted to moderation queue.'), 'success');
          renderCurrentView();
        },
        resolveReport(reportId, decision) {
          const rep = state.reports.find(r => r.id === reportId);
          if (!rep) return;
          const opinion = document.getElementById(`modOpinion_${reportId}`)?.value || 'Parecer registrado.';
          const track = state.tracks.find(x => x.id === rep.trackId);
          if (!track || track.status === 'REMOVIDO') {
            rep.status = 'ENCERRADA_PERDA_OBJETO';
          } else if (decision === 'SUSPENDER') {
            track.status = 'SUSPENSO';
            rep.status = 'PROCEDENTE_SUSPENSO';
          } else {
            rep.status = 'INDEFERIDA_ARQUIVADA';
          }
          rep.technicalOpinion = opinion;
          logAudit(`MODERACAO_${rep.status}`, rep.trackTitle, opinion);
          renderCurrentView();
        },
        getUserRole(userId) {
          const u = state.users.find(x => x.id === userId);
          return u ? u.role : 'OUVINTE';
        },
        changeUserRole(userId, newRole) {
          const target = state.users.find(u => u.id === userId);
          if (!target) return;
          if (target.role === 'ADMINISTRADOR' && newRole !== 'ADMINISTRADOR') {
            const activeAdmins = state.users.filter(u => u.role === 'ADMINISTRADOR' && !u.blocked).length;
            if (activeAdmins <= 1) {
              showToast(tr('Proibido revogar o único Administrador Mestre ativo!', 'Cannot revoke the sole active Master Administrator!'), 'error');
              renderCurrentView();
              return;
            }
          }
          target.role = newRole;
          logAudit('ALTERACAO_PAPEL', target.email, `Novo papel: ${newRole}`);
          renderCurrentView();
        },
        toggleUserBlocked(userId) {
          const target = state.users.find(u => u.id === userId);
          if (!target) return;
          if (!target.blocked && target.role === 'ADMINISTRADOR') {
            const activeAdmins = state.users.filter(u => u.role === 'ADMINISTRADOR' && !u.blocked).length;
            if (activeAdmins <= 1) {
              showToast(tr('Proibido bloquear o único Administrador Mestre ativo!', 'Cannot block the sole active Master Administrator!'), 'error');
              return;
            }
          }
          target.blocked = !target.blocked;
          renderCurrentView();
        },
        triggerManualBackup() {
          const snap = `snapshot_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.json`;
          logAudit('BACKUP_24H', snap, 'Backup completo realizado.');
          showToast(tr(`Backup ${snap} concluído!`, `Backup ${snap} completed!`), 'success');
          renderCurrentView();
        },
        openAuthModal() {
          state.authModalTab = 'profile';
          document.getElementById('authModal').classList.remove('hidden');
          renderAuthModalContent();
        },
        closeAuthModal() {
          document.getElementById('authModal').classList.add('hidden');
        },
        setAuthTab(tab) {
          state.authModalTab = tab;
          renderAuthModalContent();
        },
        async logoutSession() {
          try {
            await catalogRequest('/api/auth/session', { method: 'DELETE' });
            state.player.isPlaying = false;
            syncAudioPlayback(null);
            state.currentUser = null;
            selectedAudioFile = null;
            selectedAudioDuration = 0;
            clearCoverSelection();
            state.uploadDraft = { ...initialState.uploadDraft };
            app.closeAuthModal();
            document.getElementById('queueDrawer').classList.add('hidden');
            showWorkspace(false);
            app.setWelcomeTab('login');
          } catch (error) {
            showToast(error.message, 'error');
          }
        },
        async submitPasswordRecovery() {
          try {
            await accountRequest('/api/auth/recover', 'POST', {
              email: state.currentUser.email,
              currentPassword: document.getElementById('recCurrentPass').value,
              newPassword: document.getElementById('recNewPass').value
            });
            showToast(tr('Senha atualizada.', 'Password updated.'), 'success');
            app.setAuthTab('profile');
          } catch (error) {
            showToast(error.message, 'error');
          }
        },
        async saveUserProfile() {
          if (!state.currentUser) return;
          const fullName = document.getElementById('profName')?.value.trim() || state.currentUser.fullName;
          const bio = document.getElementById('profBio')?.value ?? state.currentUser.bio;
          if (state.currentUser.authenticated) {
            try {
              useAccount(await accountRequest(`/api/auth/profile/${state.currentUser.id}`, 'PUT', { fullName, bio }));
            } catch (error) {
              showToast(error.message, 'error');
              return;
            }
          } else {
            Object.assign(state.currentUser, { fullName, bio });
            renderCurrentView();
          }
          app.closeAuthModal();
        },
        async saveProfilePicture(button) {
          const file = document.getElementById('profilePictureFile')?.files[0];
          if (!file || !/\.(jpe?g|png)$/i.test(file.name) || file.size > 8 * 1024 * 1024) {
            showToast(tr('Selecione uma imagem JPEG ou PNG de até 8 MB.', 'Choose a JPEG or PNG image up to 8 MB.'), 'error');
            return;
          }
          const data = new FormData();
          data.append('picture', file);
          button.disabled = true;
          try {
            const updated = await catalogRequest('/api/auth/profile/picture', { method: 'POST', body: data });
            if (state.currentUser?.authenticated && state.currentUser.id === updated.id) {
              useAccount(updated);
              renderAuthModalContent();
            }
            showToast(tr('Foto de perfil atualizada.', 'Profile photo updated.'), 'success');
          } catch (error) {
            showToast(error.message, 'error');
          } finally {
            button.disabled = false;
          }
        }
      };

      window.app = app;

      originalAudio.addEventListener('ended', () => {
        if (originalTrackId !== state.player.currentTrackId) return;
        if (state.player.repeatMode === 'ONE') {
          originalAudio.currentTime = 0;
          syncAudioPlayback(state.tracks.find(track => track.id === originalTrackId));
        } else {
          state.player.isPlaying = false;
          app.nextTrack(true);
          syncPlayerBarUI();
          renderCurrentView();
        }
      });

      window.addEventListener('DOMContentLoaded', () => {
        renderWelcome();
        startPlaybackInterval();
        restoreAccount();
      });
    })();
  </script>
</body>
</html>
