spring.application.name=plataforma-streaming-audio
server.port=8080

# Configuração do Banco de Dados Relacional H2
spring.datasource.url=jdbc:h2:file:./data/streamingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Persistência JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Motor de Templates MVC Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Internacionalização (PT-BR e EN-US)
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Limites de Upload para Áudio Lossless (RF005)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=160MB

# Parâmetros de Segurança e Backup (RNF005 e RNF009)
streaming.storage.backup-dir=./data/backups
streaming.security.hmac-secret=UFSCar-EngenhariaSoftware-Grupo03-SecretKey-2026
